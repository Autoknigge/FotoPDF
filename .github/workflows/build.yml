name: Build

on:
  push:
    branches: [main]
    tags: ["[0-9]*", "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Debug-APK bauen (Testversion zum Installieren)
        run: >
          gradle assembleDebug --no-daemon
          -PADMOB_APP_ID="$ADMOB_APP_ID"
          -PADMOB_BANNER_ID="$ADMOB_BANNER_ID"

      - name: Debug-APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk FotoPdf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FotoPdf
          path: FotoPdf.apk

      - name: Keystore bereitstellen
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signierte Release-APK und AAB bauen
        if: env.HAS_KEYSTORE == 'true'
        run: >
          gradle assembleRelease bundleRelease --no-daemon
          -PADMOB_APP_ID="$ADMOB_APP_ID"
          -PADMOB_BANNER_ID="$ADMOB_BANNER_ID"
          -PKEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Release-Dateien umbenennen
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk FotoPdf-signiert.apk
          cp app/build/outputs/bundle/release/app-release.aab FotoPdf.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: FotoPdf-signiert
          path: |
            FotoPdf-signiert.apk
            FotoPdf.aab

      - name: GitHub-Release (bei Tag, z. B. 1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FotoPdf.apk
            FotoPdf-signiert.apk
            FotoPdf.aab
          fail_on_unmatched_files: false
